<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MD 뷰어 (e잉크 6인치용)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.1/markdown-it.min.js"></script>
<style>
  :root{
    --border:#000; --bg:#fff; --fg:#000; --muted:#555;
    --font-size:19px; --line-h:1.65;
  }
  *{ box-sizing:border-box; }
  *{ transition:none !important; animation:none !important; scroll-behavior:auto !important; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing:none;
  }
  .screen{ display:none; flex-direction:column; height:100vh; }
  .screen.active{ display:flex; }

  .topbar{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px; border-bottom:2px solid var(--border);
    flex-shrink:0;
  }
  .btn{
    font-size:15px; padding:9px 12px;
    background:#fff; color:#000; border:2px solid var(--border);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ background:#000; color:#fff; }
  .btn:disabled{ opacity:.4; }
  select{
    font-size:14px; padding:9px 8px; border:2px solid var(--border);
    background:#fff; color:#000;
  }

  #listScreen .topbar{ justify-content:space-between; }
  #listScreen .topbar .left{ display:flex; gap:8px; align-items:center; }
  .status-line{ padding:8px 14px; font-size:12px; color:var(--muted); border-bottom:1px solid #ccc; flex-shrink:0; }
  .file-list{ flex:1; overflow-y:auto; margin:0; padding:0; list-style:none; }
  .file-list li{ padding:16px 16px; border-bottom:1px solid #ccc; font-size:16px; cursor:pointer; }
  .file-list li .fname{ display:block; word-break:break-all; }
  .file-list li .fdate{ display:block; color:var(--muted); font-size:12px; margin-top:4px; }
  .list-empty{ padding:40px 20px; color:var(--muted); font-size:15px; line-height:1.6; text-align:center; }

  #readerScreen .topbar{ justify-content:space-between; }
  #readerScreen .title{ font-weight:bold; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin:0 8px; text-align:center; }
  .font-ctrl{ display:flex; gap:4px; flex-shrink:0; }
  .font-ctrl button{ width:34px; height:34px; font-size:14px; border:2px solid var(--border); background:#fff; }

  .page-viewport{ flex:1; overflow:hidden; position:relative; border-bottom:2px solid var(--border); }

  .md-body{ padding:24px 22px; font-size:var(--font-size); line-height:var(--line-h); }
  .md-body h1,.md-body h2,.md-body h3{ margin-top:.2em; }
  .md-body pre{ white-space:pre-wrap; border:1px solid #999; padding:8px; font-size:.85em; }
  .md-body img{ max-width:100%; display:block; }
  .md-body table{ border-collapse:collapse; width:100%; }
  .md-body table td, .md-body table th{ border:1px solid #999; padding:4px 6px; }

  .page-content{ height:100%; overflow:hidden; }

  #measureBox{ position:fixed; top:0; left:-99999px; visibility:hidden; height:auto; }

  .nav-bar{ padding:10px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .nav-bar button{ font-size:15px; padding:9px 14px; border:2px solid var(--border); background:#fff; }
  .nav-bar button:disabled{ opacity:.35; }
  .nav-bar input[type=range]{ flex:1; }
  .page-indicator{ font-size:12px; min-width:78px; text-align:center; flex-shrink:0; }
</style>
</head>
<body>

<div class="screen active" id="listScreen">
  <div class="topbar">
    <div class="left">
      <button class="btn" id="openFolderBtn">📁 파일 열기</button>
      <select id="sortSelect">
        <option value="desc">최신순</option>
        <option value="asc">오래된순</option>
      </select>
    </div>
  </div>
  <div class="status-line" id="statusLine"></div>
  <ul class="file-list" id="fileList"></ul>
</div>

<div class="screen" id="readerScreen">
  <div class="topbar">
    <button class="btn" id="backBtn">◀ 목록</button>
    <div class="title" id="fileTitle">-</div>
    <div class="font-ctrl">
      <button id="fontMinus">A-</button>
      <button id="fontPlus">A+</button>
    </div>
  </div>
  <div class="page-viewport" id="pageViewport">
    <div class="page-content md-body" id="pageContent"></div>
  </div>
  <div class="nav-bar">
    <button id="prevBtn" disabled>◀</button>
    <input type="range" id="pageSlider" min="1" max="1" value="1" disabled>
    <span class="page-indicator" id="pageIndicator">- / -</span>
    <button id="nextBtn" disabled>▶</button>
  </div>
</div>

<div class="md-body" id="measureBox"></div>

<script>
(function(){
  "use strict";

  const md = window.markdownit({ html:false, linkify:false, typographer:false });

  const listScreen = document.getElementById('listScreen');
  const readerScreen = document.getElementById('readerScreen');
  const openFolderBtn = document.getElementById('openFolderBtn');
  const sortSelect = document.getElementById('sortSelect');
  const statusLine = document.getElementById('statusLine');
  const fileListEl = document.getElementById('fileList');
  const backBtn = document.getElementById('backBtn');
  const fileTitleEl = document.getElementById('fileTitle');
  const pageViewport = document.getElementById('pageViewport');
  const pageContentEl = document.getElementById('pageContent');
  const measureBox = document.getElementById('measureBox');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageSlider = document.getElementById('pageSlider');
  const pageIndicator = document.getElementById('pageIndicator');
  const fontMinus = document.getElementById('fontMinus');
  const fontPlus = document.getElementById('fontPlus');

  let currentFile = null;      // { name, handle }
  let currentRawHtml = '';
  let pages = [''];
  let currentPage = 1;
  let totalPages = 1;
  const FONT_KEY = 'md-eink-viewer:fontsize';
  let fontSize = parseInt(localStorage.getItem(FONT_KEY) || '19', 10);
  document.documentElement.style.setProperty('--font-size', fontSize + 'px');

  const POS_KEY = 'md-eink-viewer:lastpos';

  // ---------- IndexedDB: 파일 핸들 기억 (최근 목록 + 마지막으로 쓴 위치) ----------
  // FileSystemFileHandle을 저장해두면, 다음에 showOpenFilePicker의 startIn으로 넘겨서
  // "그 파일이 있던 폴더" 위치에서 자동으로 열리게 할 수 있다 -> 폴더를 따로 스캔/기억할 필요 없음
  function idbOpen(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('md-eink-viewer', 2);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('recent')) db.createObjectStore('recent', { keyPath:'name' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(key, val){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function recentPut(entry){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('recent', 'readwrite');
      tx.objectStore('recent').put(entry);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function recentAll(){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('recent', 'readonly');
      const req = tx.objectStore('recent').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  // ---------- 부팅 ----------
  (async function boot(){
    if (!window.showOpenFilePicker){
      statusLine.textContent = '이 브라우저는 파일 선택 API를 지원하지 않습니다. Chrome/Edge에서 열어주세요.';
      return;
    }
    try{
      const lastHandle = await idbGet('lastFileHandle');
      if (lastHandle){
        const perm = await lastHandle.queryPermission({ mode:'read' });
        if (perm === 'granted'){
          await openHandle(lastHandle); // 권한 살아있으면 마지막 파일로 바로 리더 진입
          return;
        }
      }
    }catch(e){ /* 무시 */ }
    await renderFileList(); // 권한 없으면 최근 목록 화면 표시
    statusLine.textContent = '"📁 파일 열기"로 md 파일을 선택하세요.';
  })();

  // ---------- 파일 열기 버튼: 바로 OS 파일 선택창, 마지막 폴더에서 시작 ----------
  openFolderBtn.addEventListener('click', async () => {
    if (!window.showOpenFilePicker){
      alert('이 환경은 파일 선택 API를 지원하지 않습니다. 다운로드 후 Chrome/Edge에서 열어주세요.');
      return;
    }
    try{
      const lastHandle = await idbGet('lastFileHandle').catch(() => null);
      const opts = {
        types: [{ description:'Markdown', accept:{ 'text/markdown':['.md'] } }],
        excludeAcceptAllOption:false,
        multiple:false
      };
      if (lastHandle) opts.startIn = lastHandle; // 파일 핸들을 넘기면 그 폴더에서 다이얼로그가 열림
      const [handle] = await window.showOpenFilePicker(opts);
      await openHandle(handle);
    }catch(e){ console.log('file pick cancelled', e); }
  });

  sortSelect.addEventListener('change', renderFileList);

  async function renderFileList(){
    const all = await recentAll().catch(() => []);
    if (all.length === 0){
      fileListEl.innerHTML = '<div class="list-empty">최근에 연 파일이 없습니다.<br><br>상단 "📁 파일 열기"로 md 파일을 선택하세요.</div>';
      return;
    }
    const dir = sortSelect.value;
    const sorted = [...all].sort((a,b) => dir === 'asc'
      ? a.lastOpened - b.lastOpened
      : b.lastOpened - a.lastOpened);

    fileListEl.innerHTML = '';
    sorted.forEach(entry => {
      const li = document.createElement('li');
      const d = new Date(entry.lastOpened);
      const dateStr = d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
      li.innerHTML = '<span class="fname">' + escapeHtml(entry.name) + '</span><span class="fdate">' + dateStr + ' 열람</span>';
      li.addEventListener('click', async () => {
        try{
          const perm = await entry.handle.queryPermission({ mode:'read' });
          if (perm !== 'granted'){
            const req = await entry.handle.requestPermission({ mode:'read' }); // 클릭 = 사용자 제스처
            if (req !== 'granted') { alert('파일 접근 권한이 필요합니다.'); return; }
          }
          openHandle(entry.handle);
        }catch(e){ alert('파일을 열 수 없습니다. 다시 "파일 열기"로 선택해주세요.'); }
      });
      fileListEl.appendChild(li);
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showScreen(name){
    listScreen.classList.toggle('active', name === 'list');
    readerScreen.classList.toggle('active', name === 'reader');
  }
  backBtn.addEventListener('click', () => { renderFileList(); showScreen('list'); });

  // ---------- 핸들로부터 파일 열기 (목록 갱신 + 마지막 핸들 기억 + 리더 진입) ----------
  async function openHandle(handle){
    const file = await handle.getFile();
    currentFile = { name: file.name, handle };

    await idbSet('lastFileHandle', handle);
    await recentPut({ name: file.name, handle, lastOpened: Date.now() });

    fileTitleEl.textContent = file.name;
    showScreen('reader');

    const text = await file.text();
    currentRawHtml = md.render(text);
    paginate({ restoreFromRatio:true });
  }

  function loadPositions(){
    try{ return JSON.parse(localStorage.getItem(POS_KEY) || '{}'); }catch(e){ return {}; }
  }
  function savePosition(name, ratio){
    const pos = loadPositions();
    pos[name] = ratio;
    localStorage.setItem(POS_KEY, JSON.stringify(pos));
  }

  function computePages(){
    const viewportWidth = pageViewport.clientWidth;
    const viewportHeight = pageViewport.clientHeight;
    if (viewportWidth <= 0 || viewportHeight <= 0) return [''];

    measureBox.style.width = viewportWidth + 'px';
    measureBox.innerHTML = currentRawHtml;

    const children = Array.from(measureBox.children);
    if (children.length === 0){ measureBox.innerHTML=''; return ['']; }

    const result = [];
    let pageNodes = [];
    let pageStartTop = children[0].offsetTop;

    children.forEach(child => {
      const bottom = child.offsetTop + child.offsetHeight;
      const wouldExceed = (bottom - pageStartTop) > viewportHeight;
      if (pageNodes.length > 0 && wouldExceed){
        result.push(pageNodes.map(n => n.outerHTML).join(''));
        pageNodes = [child];
        pageStartTop = child.offsetTop;
      } else {
        pageNodes.push(child);
      }
    });
    if (pageNodes.length) result.push(pageNodes.map(n => n.outerHTML).join(''));

    measureBox.innerHTML = '';
    return result.length ? result : [''];
  }

  function paginate(opts){
    opts = opts || {};
    pages = computePages();
    totalPages = pages.length;

    let targetPage = currentPage;
    if (opts.restoreFromRatio){
      const pos = loadPositions();
      const ratio = pos[currentFile.name];
      targetPage = ratio ? Math.max(1, Math.min(totalPages, Math.round(ratio * totalPages))) : 1;
    }
    targetPage = Math.max(1, Math.min(totalPages, targetPage));

    pageSlider.min = 1;
    pageSlider.max = totalPages;
    pageSlider.disabled = totalPages <= 1;

    goToPage(targetPage, { save:false });
  }

  function goToPage(n, opts){
    opts = opts || {};
    n = Math.max(1, Math.min(totalPages, n));
    currentPage = n;
    pageContentEl.innerHTML = pages[n-1];

    pageSlider.value = n;
    pageIndicator.textContent = n + ' / ' + totalPages;
    prevBtn.disabled = n <= 1;
    nextBtn.disabled = n >= totalPages;

    if (opts.save !== false && currentFile){
      savePosition(currentFile.name, n / totalPages);
    }
  }

  prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
  nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

  pageSlider.addEventListener('input', () => {
    pageIndicator.textContent = pageSlider.value + ' / ' + totalPages + ' (이동예정)';
  });
  pageSlider.addEventListener('change', () => {
    goToPage(parseInt(pageSlider.value, 10));
  });

  window.addEventListener('keydown', (e) => {
    if (!readerScreen.classList.contains('active')) return;
    if (['ArrowLeft','PageUp'].includes(e.key)) goToPage(currentPage - 1);
    if (['ArrowRight','PageDown',' '].includes(e.key)) goToPage(currentPage + 1);
    if (e.key === 'Escape') showScreen('list');
  });

  fontMinus.addEventListener('click', () => { fontSize = Math.max(14, fontSize - 2); applyFontSize(); });
  fontPlus.addEventListener('click',  () => { fontSize = Math.min(30, fontSize + 2); applyFontSize(); });
  function applyFontSize(){
    document.documentElement.style.setProperty('--font-size', fontSize + 'px');
    localStorage.setItem(FONT_KEY, String(fontSize));
    if (currentFile) paginate({ restoreFromRatio:true });
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (currentFile && readerScreen.classList.contains('active')) paginate({ restoreFromRatio:true });
    }, 150);
  });

})();
</script>
</body>
</html>
