<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MD 뷰어 (e잉크용)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.1/markdown-it.min.js"></script>
<style>
  :root{
    --border:#000;
    --bg:#fff;
    --fg:#000;
    --muted:#555;
    --rail-w:260px;
    --font-size:19px;
    --line-h:1.65;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
    /* e잉크: 트랜지션/애니메이션 전면 금지 */
    -webkit-font-smoothing:none;
  }
  *{ transition:none !important; animation:none !important; scroll-behavior:auto !important; }

  .app{ display:flex; height:100vh; }

  /* ---------- 좌측 메뉴레일 ---------- */
  .rail{
    width:var(--rail-w); min-width:var(--rail-w);
    border-right:2px solid var(--border);
    display:flex; flex-direction:column;
    height:100%;
  }
  .rail-top{
    padding:14px; border-bottom:2px solid var(--border);
    display:flex; flex-direction:column; gap:8px;
  }
  .btn{
    font-size:15px; padding:10px 12px;
    background:#fff; color:#000;
    border:2px solid var(--border);
    cursor:pointer; text-align:center;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ background:#000; color:#fff; }
  .btn:disabled{ opacity:.4; cursor:default; }
  select{
    font-size:14px; padding:8px; border:2px solid var(--border);
    background:#fff; color:#000; width:100%;
  }
  .rail-list{
    flex:1; overflow-y:auto; /* 목록은 길어질 수 있어 스크롤 허용 (본문 읽기와 무관) */
    padding:0; margin:0; list-style:none;
  }
  .rail-list li{
    padding:10px 14px; border-bottom:1px solid #ccc;
    font-size:14px; cursor:pointer; word-break:break-all;
  }
  .rail-list li .fname{ display:block; }
  .rail-list li .fdate{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .rail-list li.active{ background:#000; color:#fff; }
  .rail-list li.active .fdate{ color:#ccc; }
  .rail-empty{ padding:16px; color:var(--muted); font-size:13px; }

  /* ---------- 우측 뷰어 ---------- */
  .viewer{ flex:1; display:flex; flex-direction:column; height:100%; min-width:0; }
  .viewer-header{
    padding:10px 16px; border-bottom:2px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-size:14px;
  }
  .viewer-header .title{ font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .font-ctrl{ display:flex; gap:4px; }
  .font-ctrl button{ width:32px; height:32px; font-size:14px; border:1px solid var(--border); background:#fff; cursor:pointer; }

  .page-viewport{
    flex:1; overflow:hidden; position:relative;
    border-bottom:2px solid var(--border);
  }
  .page-content{
    height:100%;
    column-gap:0;
    padding:28px 34px;
    font-size:var(--font-size);
    line-height:var(--line-h);
  }
  .page-content h1,.page-content h2,.page-content h3{ break-after:avoid; break-inside:avoid; }
  .page-content pre, .page-content table, .page-content blockquote, .page-content img{
    break-inside:avoid;
  }
  .page-content pre{ white-space:pre-wrap; border:1px solid #999; padding:8px; }
  .page-content img{ max-width:100%; }
  .page-content table{ border-collapse:collapse; width:100%; }
  .page-content table td, .page-content table th{ border:1px solid #999; padding:4px 8px; }
  .placeholder{ padding:40px; color:var(--muted); font-size:15px; }

  .nav-bar{
    padding:10px 16px; display:flex; align-items:center; gap:10px;
  }
  .nav-bar button{ font-size:15px; padding:8px 16px; border:2px solid var(--border); background:#fff; cursor:pointer; }
  .nav-bar button:disabled{ opacity:.35; }
  .nav-bar input[type=range]{ flex:1; }
  .page-indicator{ font-size:13px; min-width:90px; text-align:center; }
</style>
</head>
<body>
<div class="app">

  <div class="rail">
    <div class="rail-top">
      <button class="btn" id="openFolderBtn">📁 폴더 선택</button>
      <select id="sortSelect">
        <option value="desc">날짜 내림차순 (최신순)</option>
        <option value="asc">날짜 오름차순 (오래된순)</option>
      </select>
    </div>
    <ul class="rail-list" id="fileList">
      <div class="rail-empty">폴더를 선택하면 .md 파일 목록이 표시됩니다.</div>
    </ul>
  </div>

  <div class="viewer">
    <div class="viewer-header">
      <div class="title" id="fileTitle">파일을 선택하세요</div>
      <div class="font-ctrl">
        <button id="fontMinus">A-</button>
        <button id="fontPlus">A+</button>
      </div>
    </div>
    <div class="page-viewport" id="pageViewport">
      <div class="placeholder" id="placeholder">왼쪽에서 폴더를 선택하고 md 파일을 골라주세요.<br><br>
      ⚠️ 이 미리보기(artifact) 화면은 샌드박스 iframe이라 브라우저 폴더 선택 권한(File System Access API)이 막혀 있을 수 있습니다. 이 경우 파일을 다운로드해서 일반 브라우저 탭(Chrome/Edge)에서 직접 열어 테스트해주세요.</div>
      <div class="page-content" id="pageContent" style="display:none;"></div>
    </div>
    <div class="nav-bar">
      <button id="prevBtn" disabled>◀ 이전</button>
      <input type="range" id="pageSlider" min="1" max="1" value="1" disabled>
      <span class="page-indicator" id="pageIndicator">- / -</span>
      <button id="nextBtn" disabled>다음 ▶</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // markdown-it: 코어만, 플러그인/하이라이터 없음 (성능 우선)
  const md = window.markdownit({ html:false, linkify:false, typographer:false });

  const fileListEl   = document.getElementById('fileList');
  const sortSelect    = document.getElementById('sortSelect');
  const openFolderBtn = document.getElementById('openFolderBtn');
  const fileTitleEl   = document.getElementById('fileTitle');
  const pageViewport  = document.getElementById('pageViewport');
  const pageContentEl = document.getElementById('pageContent');
  const placeholderEl = document.getElementById('placeholder');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageSlider = document.getElementById('pageSlider');
  const pageIndicator = document.getElementById('pageIndicator');
  const fontMinus = document.getElementById('fontMinus');
  const fontPlus  = document.getElementById('fontPlus');

  let files = [];          // {name, handle, lastModified}
  let currentFile = null;  // 현재 열려있는 file entry
  let currentPage = 1;
  let totalPages = 1;
  let fontSize = 19;

  const STORE_KEY = 'md-eink-viewer:lastpos'; // { [filename]: ratio(0~1) }

  function loadPositions(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }catch(e){ return {}; }
  }
  function savePosition(name, ratio){
    const pos = loadPositions();
    pos[name] = ratio;
    localStorage.setItem(STORE_KEY, JSON.stringify(pos));
  }

  // ---------- 폴더 열기 ----------
  openFolderBtn.addEventListener('click', async () => {
    if (!window.showDirectoryPicker){
      alert('이 브라우저/미리보기 환경은 File System Access API를 지원하지 않습니다.\n다운로드한 HTML을 Chrome/Edge에서 직접 열어 테스트해주세요.');
      return;
    }
    try{
      const dirHandle = await window.showDirectoryPicker();
      const collected = [];
      for await (const [name, handle] of dirHandle.entries()){
        if (handle.kind === 'file' && name.toLowerCase().endsWith('.md')){
          const f = await handle.getFile();
          collected.push({ name, handle, lastModified: f.lastModified });
        }
      }
      files = collected;
      renderFileList();
    }catch(err){
      // 사용자가 취소했거나 권한 거부
      console.log('folder pick cancelled/denied', err);
    }
  });

  sortSelect.addEventListener('change', renderFileList);

  function renderFileList(){
    if (files.length === 0){
      fileListEl.innerHTML = '<div class="rail-empty">.md 파일이 없습니다.</div>';
      return;
    }
    const dir = sortSelect.value; // asc | desc
    const sorted = [...files].sort((a,b) => dir === 'asc'
      ? a.lastModified - b.lastModified
      : b.lastModified - a.lastModified);

    fileListEl.innerHTML = '';
    sorted.forEach(f => {
      const li = document.createElement('li');
      const d = new Date(f.lastModified);
      const dateStr = d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
      li.innerHTML = '<span class="fname">' + escapeHtml(f.name) + '</span><span class="fdate">' + dateStr + '</span>';
      if (currentFile && currentFile.name === f.name) li.classList.add('active');
      li.addEventListener('click', () => openFile(f));
      fileListEl.appendChild(li);
    });

    // 최초 진입 시 가장 최근(정렬 결과 상단이 desc 기준 최신) 파일 자동 오픈
    if (!currentFile && dir === 'desc'){
      openFile(sorted[0]);
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- 파일 열기 ----------
  async function openFile(f){
    currentFile = f;
    fileTitleEl.textContent = f.name;
    placeholderEl.style.display = 'none';
    pageContentEl.style.display = 'block';

    const file = await f.handle.getFile();
    const text = await file.text();
    pageContentEl.innerHTML = md.render(text);

    // 하이라이트: 목록 active 갱신
    Array.from(fileListEl.children).forEach(li => li.classList.remove('active'));
    const match = Array.from(fileListEl.children).find(li => li.querySelector('.fname')?.textContent === f.name);
    if (match) match.classList.add('active');

    paginate({ restoreFromRatio:true });
  }

  // ---------- 페이지네이션 (네이티브 CSS 컬럼) ----------
  function paginate(opts){
    opts = opts || {};
    const viewportWidth = pageViewport.clientWidth;
    if (viewportWidth <= 0) return;

    // 1) 컬럼 폭 = 뷰포트 폭 그대로 -> 한 컬럼 = 한 페이지
    pageContentEl.style.transform = 'translateX(0px)';
    pageContentEl.style.columnWidth = viewportWidth + 'px';
    pageContentEl.style.width = viewportWidth + 'px';

    // 2) 브라우저가 컬럼 레이아웃 계산하도록 강제 후 측정 (읽기/쓰기 분리)
    requestAnimationFrame(() => {
      const scrollW = pageContentEl.scrollWidth;
      totalPages = Math.max(1, Math.round(scrollW / viewportWidth));

      let targetPage = currentPage;
      if (opts.restoreFromRatio){
        const pos = loadPositions();
        const ratio = pos[currentFile.name];
        targetPage = ratio ? Math.max(1, Math.min(totalPages, Math.round(ratio * totalPages))) : 1;
      }
      targetPage = Math.max(1, Math.min(totalPages, targetPage));

      pageSlider.min = 1;
      pageSlider.max = totalPages;
      pageSlider.disabled = totalPages <= 1;

      goToPage(targetPage, { save:false });
    });
  }

  function goToPage(n, opts){
    opts = opts || {};
    n = Math.max(1, Math.min(totalPages, n));
    currentPage = n;
    const viewportWidth = pageViewport.clientWidth;
    pageContentEl.style.transform = 'translateX(-' + ((n-1) * viewportWidth) + 'px)';

    pageSlider.value = n;
    pageIndicator.textContent = n + ' / ' + totalPages;
    prevBtn.disabled = n <= 1;
    nextBtn.disabled = n >= totalPages;

    if (opts.save !== false && currentFile){
      savePosition(currentFile.name, n / totalPages);
    }
  }

  prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
  nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

  // 슬라이더: 드래그 중(input)엔 라벨만 갱신, 손 뗄 때(change)만 실제 페이지 이동
  // -> e잉크에서 드래그 중 계속 리프레시 시도해 잔상 남는 것 방지
  pageSlider.addEventListener('input', () => {
    pageIndicator.textContent = pageSlider.value + ' / ' + totalPages + ' (이동 예정)';
  });
  pageSlider.addEventListener('change', () => {
    goToPage(parseInt(pageSlider.value, 10));
  });

  // 키보드 매핑 (e잉크 기기 물리버튼이 방향키/PageUp/Down으로 들어오는 경우 대응)
  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft','PageUp'].includes(e.key)) goToPage(currentPage - 1);
    if (['ArrowRight','PageDown',' '].includes(e.key)) goToPage(currentPage + 1);
  });

  // 폰트 크기 변경 -> 재계산 트리거
  fontMinus.addEventListener('click', () => { fontSize = Math.max(14, fontSize - 2); applyFontSize(); });
  fontPlus.addEventListener('click',  () => { fontSize = Math.min(30, fontSize + 2); applyFontSize(); });
  function applyFontSize(){
    document.documentElement.style.setProperty('--font-size', fontSize + 'px');
    if (currentFile) paginate({ restoreFromRatio:true });
  }

  // 리사이즈(회전 등) -> 디바운스 후 재계산 트리거
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (currentFile) paginate({ restoreFromRatio:true });
    }, 150);
  });

})();
</script>
</body>
</html>
