<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitNomad — Posts</title>

  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/tailwind.config.js"></script>
  <style>
    /* scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 2px,
        rgba(0,255,127,0.012) 2px, rgba(0,255,127,0.012) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    html, body {
      background-color: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
    }

    /* topbar glow line */
    #topbar {
      border-bottom: 1px solid #222;
      box-shadow: 0 1px 0 0 rgba(0,255,127,0.08);
    }

    /* sidebar scroll */
    #sidebar {
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #222 transparent;
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-track { background: transparent; }
    #sidebar::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

    /* content scroll */
    #content {
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #222 transparent;
    }
    #content::-webkit-scrollbar { width: 4px; }
    #content::-webkit-scrollbar-track { background: transparent; }
    #content::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

    /* neon cursor blink */
    .cursor-blink::after {
      content: '▋';
      color: #00FF7F;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── light-mode prose (post body) ───────────────────────── */
    #post-body {
      background: #ffffff;
      color: #1a1a1a;
    }
    #post-body h1,
    #post-body h2,
    #post-body h3,
    #post-body h4,
    #post-body h5,
    #post-body h6 {
      color: #111111;
      font-weight: 700;
      line-height: 1.3;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }
    #post-body h1 { font-size: 1.75rem; }
    #post-body h2 { font-size: 1.35rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; }
    #post-body h3 { font-size: 1.1rem; }
    #post-body p  { margin-bottom: 1em; line-height: 1.8; }
    #post-body a  { color: #059669; text-decoration: underline; }
    #post-body a:hover { color: #047857; }
    #post-body code {
      background: #f3f4f6;
      color: #111111;
      padding: 0.15em 0.4em;
      border-radius: 3px;
      font-size: 0.875em;
      font-family: 'JetBrains Mono', monospace;
    }
    #post-body pre {
      background: #f3f4f6;
      padding: 1em;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 1em;
    }
    #post-body pre code { background: none; padding: 0; }
    #post-body blockquote {
      border-left: 3px solid #d1d5db;
      padding-left: 1em;
      color: #555555;
      margin: 1em 0;
    }
    #post-body ul { list-style-type: disc;    margin-bottom: 1em; padding-left: 1.5em; }
    #post-body ol { list-style-type: decimal; margin-bottom: 1em; padding-left: 1.5em; }
    #post-body li { margin-bottom: 0.25em; line-height: 1.75; }
    #post-body img { max-width: 100%; border-radius: 6px; margin: 1em 0; }
    #post-body table { width: 100%; border-collapse: collapse; margin-bottom: 1em; }
    #post-body th,
    #post-body td { border: 1px solid #e5e7eb; padding: 0.5em 0.75em; }
    #post-body th { background: #f9fafb; font-weight: 600; }
    #post-body hr { border: none; border-top: 1px solid #e5e7eb; margin: 2em 0; }
    #post-body strong { font-weight: 700; }
    #post-body em { font-style: italic; }
  </style>
</head>
<body class="flex flex-col" style="height:100vh;">

  <!-- TOP BAR -->
  <header id="topbar" class="flex items-center gap-4 px-6 py-3 shrink-0">
    <a href="/" class="text-muted hover:text-neon transition-colors text-sm font-mono">←</a>
    <span class="w-px h-4 bg-line"></span>
    <h1 class="font-barlow font-black text-xl tracking-widest text-neon uppercase">
      GitNomad
    </h1>
    <span class="text-muted font-mono text-xs">/ posts</span>
    <div class="ml-auto flex items-center gap-3">
      <span class="text-muted font-mono text-xs cursor-blink"></span>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="flex flex-1 min-h-0">

    <!-- LEFT SIDEBAR: post list -->
    <aside id="sidebar" class="w-72 shrink-0 border-r border-line flex flex-col">
      <div class="px-4 py-3 border-b border-line">
        <span class="font-mono text-xs text-muted uppercase tracking-widest">Posts</span>
      </div>
      <div id="cat-filter" class="px-3 py-2 border-b border-line flex flex-wrap gap-1 hidden"></div>
      <ul id="post-list" class="flex-1 p-2"></ul>
    </aside>

    <!-- RIGHT CONTENT: post body -->
    <main id="content" class="flex-1 flex flex-col">
      <div id="welcome" class="flex-1 flex flex-col items-center justify-center gap-4 text-center px-8">
        <span class="font-mono text-4xl text-line select-none">—</span>
        <p class="font-barlow text-lg tracking-widest text-muted uppercase">Select a post</p>
        <p class="font-mono text-xs text-muted">글을 선택하면 여기에 표시됩니다</p>
      </div>
      <article id="post-body" class="hidden flex-1 p-10 max-w-3xl mx-auto w-full"></article>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="reader.js"></script>
</body>
</html>
