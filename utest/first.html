<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube 자막 추출기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0f0f;
            color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff0000, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #f1f1f1;
            font-size: 15px;
            min-width: 200px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff0000;
        }

        .input-group input::placeholder {
            color: #555;
        }

        .input-group button {
            padding: 14px 32px;
            border-radius: 12px;
            border: none;
            background: #ff0000;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            white-space: nowrap;
        }

        .input-group button:hover {
            background: #cc0000;
        }

        .input-group button:active {
            transform: scale(0.96);
        }

        .input-group button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        /* 로딩 스피너 */
        .spinner {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .spinner.active {
            display: block;
        }

        .spinner .dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff0000;
            margin: 0 6px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .spinner .dot:nth-child(1) {
            animation-delay: -0.32s;
        }
        .spinner .dot:nth-child(2) {
            animation-delay: -0.16s;
        }
        .spinner .dot:nth-child(3) {
            animation-delay: 0;
        }

        @keyframes bounce {
            0%,
            80%,
            100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        /* 결과 영역 */
        .result {
            display: none;
            margin-top: 20px;
        }

        .result.active {
            display: block;
        }

        .result .info {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .result .info .title {
            font-weight: 600;
            font-size: 16px;
            color: #f1f1f1;
        }

        .result .info .count {
            color: #888;
            font-size: 13px;
            background: #2a2a2a;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .result .transcript-box {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px 20px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.8;
        }

        .result .transcript-box::-webkit-scrollbar {
            width: 6px;
        }

        .result .transcript-box::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .result .transcript-box::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        .result .transcript-item {
            display: flex;
            gap: 16px;
            padding: 6px 0;
            border-bottom: 1px solid #252525;
        }

        .result .transcript-item:last-child {
            border-bottom: none;
        }

        .result .transcript-item .time {
            color: #ff6b6b;
            font-weight: 500;
            min-width: 70px;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .result .transcript-item .text {
            color: #e0e0e0;
            word-break: break-word;
        }

        /* 에러 메시지 */
        .error {
            display: none;
            background: #2a0a0a;
            border: 1px solid #661111;
            border-radius: 12px;
            padding: 16px 20px;
            color: #ff6b6b;
            margin-top: 16px;
        }

        .error.active {
            display: block;
        }

        /* 예시 URL */
        .examples {
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }

        .examples a {
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.3s;
        }

        .examples a:hover {
            color: #ff6b6b;
        }

        /* 반응형 */
        @media (max-width: 600px) {
            .input-group button {
                width: 100%;
                justify-content: center;
            }

            .result .info {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 YouTube 자막 추출기</h1>
        <p class="subtitle">YouTube URL을 입력하면 자막을 보여줍니다</p>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="YouTube URL 또는 비디오 ID를 입력하세요 (예: dQw4w9WgXcQ)" />
            <button id="fetchBtn">자막 가져오기</button>
        </div>

        <div class="examples">
            💡 예시: 
            <a onclick="setExample('dQw4w9WgXcQ')">dQw4w9WgXcQ</a>, 
            <a onclick="setExample('https://www.youtube.com/watch?v=dQw4w9WgXcQ')">전체 URL</a>
        </div>

        <!-- 로딩 -->
        <div class="spinner" id="spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- 에러 -->
        <div class="error" id="error"></div>

        <!-- 결과 -->
        <div class="result" id="result">
            <div class="info">
                <span class="title" id="videoTitle">제목을 불러오는 중...</span>
                <span class="count" id="transcriptCount">자막 수: 0</span>
            </div>
            <div class="transcript-box" id="transcriptBox"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. YouTube 비디오 ID 추출 함수
        // ============================================================
        function extractVideoId(url) {
            if (!url) return null;

            // 이미 비디오 ID인 경우 (11자)
            if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) {
                return url.trim();
            }

            // 다양한 YouTube URL 패턴
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/live\/([a-zA-Z0-9_-]{11})/
            ];

            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }

            return null;
        }

        // ============================================================
        // 2. 자막을 가져오는 API (공개 프록시 사용)
        //    ※ 참고: https://yt-api.com/  (무료 공개 API, 요청 제한 있음)
        // ============================================================
        async function fetchTranscript(videoId) {
            // 공개 API 사용 (CORS 지원)
            const apiUrl = `https://yt-api.com/api/transcripts?videoId=${videoId}`;

            const response = await fetch(apiUrl, {
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`API 오류 (${response.status}): ${errorText}`);
            }

            const data = await response.json();

            // API 응답 구조 확인
            if (!data.transcripts || data.transcripts.length === 0) {
                throw new Error('이 비디오에는 자막이 없거나 접근할 수 없습니다.');
            }

            // 첫 번째 자막 트랙 사용 (보통 영어 또는 원본)
            const transcript = data.transcripts[0];
            return {
                title: data.title || '제목 없음',
                items: transcript.snippets || transcript.items || []
            };
        }

        // ============================================================
        // 3. UI 제어
        // ============================================================
        const urlInput = document.getElementById('urlInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const spinner = document.getElementById('spinner');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const videoTitle = document.getElementById('videoTitle');
        const transcriptCount = document.getElementById('transcriptCount');
        const transcriptBox = document.getElementById('transcriptBox');

        // 예시 URL 설정
        function setExample(url) {
            urlInput.value = url;
            fetchTranscriptHandler();
        }

        // 시간 포맷 (초 -> HH:MM:SS)
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // 자막 표시
        function displayTranscript(title, items) {
            videoTitle.textContent = title || '제목 없음';
            transcriptCount.textContent = `자막 수: ${items.length}`;

            if (items.length === 0) {
                transcriptBox.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">자막 항목이 없습니다.</p>';
                return;
            }

            let html = '';
            for (const item of items) {
                const time = formatTime(item.start || 0);
                const text = item.text || '';
                html += `
                    <div class="transcript-item">
                        <span class="time">${time}</span>
                        <span class="text">${text}</span>
                    </div>
                `;
            }
            transcriptBox.innerHTML = html;
        }

        // 에러 표시
        function showError(message) {
            error.textContent = `⚠️ ${message}`;
            error.classList.add('active');
        }

        function hideError() {
            error.classList.remove('active');
        }

        // 로딩 상태
        function setLoading(isLoading) {
            if (isLoading) {
                spinner.classList.add('active');
                fetchBtn.disabled = true;
                fetchBtn.textContent = '가져오는 중...';
                result.classList.remove('active');
                hideError();
            } else {
                spinner.classList.remove('active');
                fetchBtn.disabled = false;
                fetchBtn.textContent = '자막 가져오기';
            }
        }

        // 메인 핸들러
        async function fetchTranscriptHandler() {
            const input = urlInput.value.trim();
            if (!input) {
                showError('YouTube URL 또는 비디오 ID를 입력해주세요.');
                return;
            }

            const videoId = extractVideoId(input);
            if (!videoId) {
                showError('올바른 YouTube URL 또는 비디오 ID가 아닙니다.');
                return;
            }

            setLoading(true);
            hideError();
            result.classList.remove('active');

            try {
                const data = await fetchTranscript(videoId);
                displayTranscript(data.title, data.items);
                result.classList.add('active');
            } catch (err) {
                showError(err.message || '자막을 불러오는 중 오류가 발생했습니다.');
                result.classList.remove('active');
            } finally {
                setLoading(false);
            }
        }

        // 이벤트 바인딩
        fetchBtn.addEventListener('click', fetchTranscriptHandler);

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                fetchTranscriptHandler();
            }
        });

        // 페이지 로드 시 포커스
        window.addEventListener('load', () => {
            urlInput.focus();
        });

        // 전역에 함수 노출 (예시 링크용)
        window.setExample = setExample;
    </script>
</body>
</html>
