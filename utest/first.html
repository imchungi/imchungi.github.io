<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube 자막 추출기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0f0f;
            color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff0000, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #f1f1f1;
            font-size: 15px;
            min-width: 200px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff0000;
        }

        .input-group input::placeholder {
            color: #555;
        }

        .input-group button {
            padding: 14px 32px;
            border-radius: 12px;
            border: none;
            background: #ff0000;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            white-space: nowrap;
        }

        .input-group button:hover {
            background: #cc0000;
        }

        .input-group button:active {
            transform: scale(0.96);
        }

        .input-group button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .spinner.active {
            display: block;
        }

        .spinner .dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff0000;
            margin: 0 6px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .spinner .dot:nth-child(1) {
            animation-delay: -0.32s;
        }
        .spinner .dot:nth-child(2) {
            animation-delay: -0.16s;
        }
        .spinner .dot:nth-child(3) {
            animation-delay: 0;
        }

        @keyframes bounce {
            0%,
            80%,
            100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .result {
            display: none;
            margin-top: 20px;
        }

        .result.active {
            display: block;
        }

        .result .info {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .result .info .title {
            font-weight: 600;
            font-size: 16px;
            color: #f1f1f1;
        }

        .result .info .count {
            color: #888;
            font-size: 13px;
            background: #2a2a2a;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .result .transcript-box {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px 20px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.8;
        }

        .result .transcript-box::-webkit-scrollbar {
            width: 6px;
        }

        .result .transcript-box::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .result .transcript-box::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        .result .transcript-item {
            display: flex;
            gap: 16px;
            padding: 6px 0;
            border-bottom: 1px solid #252525;
        }

        .result .transcript-item:last-child {
            border-bottom: none;
        }

        .result .transcript-item .time {
            color: #ff6b6b;
            font-weight: 500;
            min-width: 70px;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .result .transcript-item .text {
            color: #e0e0e0;
            word-break: break-word;
        }

        .error {
            display: none;
            background: #2a0a0a;
            border: 1px solid #661111;
            border-radius: 12px;
            padding: 16px 20px;
            color: #ff6b6b;
            margin-top: 16px;
        }

        .error.active {
            display: block;
        }

        .examples {
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }

        .examples a {
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.3s;
        }

        .examples a:hover {
            color: #ff6b6b;
        }

        .status-badge {
            display: inline-block;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 12px;
            background: #2a2a2a;
            color: #888;
            margin-left: 8px;
        }

        @media (max-width: 600px) {
            .input-group button {
                width: 100%;
                justify-content: center;
            }

            .result .info {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 YouTube 자막 추출기</h1>
        <p class="subtitle">YouTube URL을 입력하면 자막을 보여줍니다</p>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="YouTube URL 또는 비디오 ID (예: dQw4w9WgXcQ)" />
            <button id="fetchBtn">자막 가져오기</button>
        </div>

        <div class="examples">
            💡 예시: 
            <a onclick="setExample('dQw4w9WgXcQ')">dQw4w9WgXcQ</a>, 
            <a onclick="setExample('https://www.youtube.com/watch?v=dQw4w9WgXcQ')">전체 URL</a>
            <span class="status-badge" id="apiStatus">🔍 API: 프록시</span>
        </div>

        <div class="spinner" id="spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="info">
                <span class="title" id="videoTitle">제목을 불러오는 중...</span>
                <span class="count" id="transcriptCount">자막 수: 0</span>
            </div>
            <div class="transcript-box" id="transcriptBox"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. YouTube 비디오 ID 추출 함수
        // ============================================================
        function extractVideoId(url) {
            if (!url) return null;

            if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) {
                return url.trim();
            }

            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/live\/([a-zA-Z0-9_-]{11})/
            ];

            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }

            return null;
        }

        // ============================================================
        // 2. CORS 프록시를 통한 YouTube 자막 가져오기
        // ============================================================
        async function fetchTranscript(videoId) {
            // 방법 1: yt-api.com (CORS 지원)
            try {
                const apiUrl = `https://yt-api.com/api/transcripts?videoId=${videoId}`;
                const response = await fetch(apiUrl, {
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.transcripts && data.transcripts.length > 0) {
                        const transcript = data.transcripts[0];
                        return {
                            title: data.title || '제목 없음',
                            items: transcript.snippets || transcript.items || []
                        };
                    }
                }
            } catch (e) {
                console.log('yt-api.com 실패, 다음 방법 시도...');
            }

            // 방법 2: CORS 프록시 + YouTube API (더 안정적)
            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const youtubeUrl = `https://www.youtube.com/watch?v=${videoId}`;
                
                const response = await fetch(proxyUrl + encodeURIComponent(youtubeUrl));
                if (!response.ok) throw new Error('프록시 요청 실패');
                
                const html = await response.text();
                
                // YouTube 페이지에서 자막 데이터 추출
                const captionsData = extractCaptionsFromHTML(html);
                if (captionsData) {
                    return captionsData;
                }
                
                throw new Error('자막 데이터를 찾을 수 없습니다.');
            } catch (e) {
                console.log('프록시 방법 실패:', e);
                throw new Error('자막을 불러올 수 없습니다. (자막이 없거나 API 제한에 걸렸을 수 있습니다)');
            }
        }

        // ============================================================
        // 3. YouTube HTML에서 자막 데이터 추출
        // ============================================================
        function extractCaptionsFromHTML(html) {
            try {
                // 1) ytInitialPlayerResponse 찾기
                const playerResponseMatch = html.match(/var ytInitialPlayerResponse\s*=\s*({.+?});/);
                if (!playerResponseMatch) {
                    // 다른 패턴 시도
                    const altMatch = html.match(/ytInitialPlayerResponse\s*=\s*({.+?});/);
                    if (!altMatch) return null;
                    var data = JSON.parse(altMatch[1]);
                } else {
                    var data = JSON.parse(playerResponseMatch[1]);
                }

                // 2) 자막 트랙 찾기
                const captions = data?.captions?.playerCaptionsTracklistRenderer?.captionTracks;
                if (!captions || captions.length === 0) return null;

                // 3) 첫 번째 자막 트랙 사용 (보통 영어 또는 한국어)
                const track = captions[0];
                const baseUrl = track.baseUrl;

                // 4) 자막 데이터 가져오기 (프록시 사용)
                return fetchSubtitleData(baseUrl, track.name?.simpleText || '자막');
            } catch (e) {
                console.error('HTML 파싱 오류:', e);
                return null;
            }
        }

        // ============================================================
        // 4. 자막 XML/JSON 데이터 가져오기
        // ============================================================
        async function fetchSubtitleData(baseUrl, trackName) {
            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const response = await fetch(proxyUrl + encodeURIComponent(baseUrl));
                
                if (!response.ok) throw new Error('자막 데이터를 가져올 수 없습니다.');
                
                const data = await response.text();
                
                // XML 파싱 (자막은 보통 XML 형식)
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data, 'text/xml');
                
                const items = [];
                const textNodes = xmlDoc.getElementsByTagName('text');
                
                for (let i = 0; i < textNodes.length; i++) {
                    const node = textNodes[i];
                    const start = parseFloat(node.getAttribute('start') || 0);
                    const dur = parseFloat(node.getAttribute('dur') || 0);
                    const text = node.textContent || '';
                    
                    if (text.trim()) {
                        items.push({
                            start: start,
                            duration: dur,
                            text: text.trim()
                        });
                    }
                }
                
                if (items.length === 0) {
                    throw new Error('자막 내용이 비어있습니다.');
                }
                
                return {
                    title: trackName || 'YouTube 자막',
                    items: items
                };
            } catch (e) {
                console.error('자막 데이터 파싱 오류:', e);
                throw new Error('자막 데이터를 파싱할 수 없습니다.');
            }
        }

        // ============================================================
        // 5. UI 제어
        // ============================================================
        const urlInput = document.getElementById('urlInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const spinner = document.getElementById('spinner');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const videoTitle = document.getElementById('videoTitle');
        const transcriptCount = document.getElementById('transcriptCount');
        const transcriptBox = document.getElementById('transcriptBox');
        const apiStatus = document.getElementById('apiStatus');

        function setExample(url) {
            urlInput.value = url;
            fetchTranscriptHandler();
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function displayTranscript(title, items) {
            videoTitle.textContent = title || '제목 없음';
            transcriptCount.textContent = `자막 수: ${items.length}`;

            if (items.length === 0) {
                transcriptBox.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">자막 항목이 없습니다.</p>';
                return;
            }

            let html = '';
            for (const item of items) {
                const time = formatTime(item.start || 0);
                const text = item.text || '';
                html += `
                    <div class="transcript-item">
                        <span class="time">${time}</span>
                        <span class="text">${text}</span>
                    </div>
                `;
            }
            transcriptBox.innerHTML = html;
        }

        function showError(message) {
            error.textContent = `⚠️ ${message}`;
            error.classList.add('active');
        }

        function hideError() {
            error.classList.remove('active');
        }

        function setLoading(isLoading) {
            if (isLoading) {
                spinner.classList.add('active');
                fetchBtn.disabled = true;
                fetchBtn.textContent = '가져오는 중...';
                result.classList.remove('active');
                hideError();
                apiStatus.textContent = '⏳ 로딩 중...';
            } else {
                spinner.classList.remove('active');
                fetchBtn.disabled = false;
                fetchBtn.textContent = '자막 가져오기';
                apiStatus.textContent = '✅ 완료';
            }
        }

        // ============================================================
        // 6. 메인 핸들러
        // ============================================================
        async function fetchTranscriptHandler() {
            const input = urlInput.value.trim();
            if (!input) {
                showError('YouTube URL 또는 비디오 ID를 입력해주세요.');
                return;
            }

            const videoId = extractVideoId(input);
            if (!videoId) {
                showError('올바른 YouTube URL 또는 비디오 ID가 아닙니다.');
                return;
            }

            setLoading(true);
            hideError();
            result.classList.remove('active');

            try {
                const data = await fetchTranscript(videoId);
                displayTranscript(data.title, data.items);
                result.classList.add('active');
                apiStatus.textContent = '✅ 자막 로드 성공';
            } catch (err) {
                showError(err.message || '자막을 불러오는 중 오류가 발생했습니다.');
                result.classList.remove('active');
                apiStatus.textContent = '❌ 오류 발생';
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        // 7. 이벤트 바인딩
        // ============================================================
        fetchBtn.addEventListener('click', fetchTranscriptHandler);

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                fetchTranscriptHandler();
            }
        });

        window.addEventListener('load', () => {
            urlInput.focus();
            apiStatus.textContent = '🔍 API: 프록시 + YouTube';
        });

        window.setExample = setExample;
    </script>
</body>
</html>
