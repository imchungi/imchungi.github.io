<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 자막 추출기 (Pure JS)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9f9f9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #ff0000; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { padding: 10px 20px; background: #ff0000; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #cc0000; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin: 20px 0; font-weight: bold; color: #555; }
        #transcript { white-space: pre-wrap; background: #f4f4f4; padding: 20px; border-radius: 5px; border-left: 4px solid #ff0000; line-height: 1.6; max-height: 500px; overflow-y: auto; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 유튜브 자막 추출기</h1>
    <p>백엔드 없이 JavaScript만으로 자막을 가져옵니다. (CORS Proxy 사용)</p>
    
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        <button id="fetchBtn" onclick="fetchTranscript()">자막 가져오기</button>
    </div>

    <div id="status"></div>
    <div id="transcript"></div>
</div>

<script>
    // CORS 우회를 위한 프록시 서버 (allorigins API 사용)
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";

    function extractVideoId(url) {
        const regex = /(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
        const match = url.match(regex);
        return match ? match[1] : null;
    }

    async function fetchTranscript() {
        const urlInput = document.getElementById('urlInput').value;
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        const fetchBtn = document.getElementById('fetchBtn');

        const videoId = extractVideoId(urlInput);
        
        if (!videoId) {
            statusDiv.innerHTML = '<span class="error">올바른 유튜브 URL을 입력해주세요.</span>';
            return;
        }

        // 로딩 상태 초기화
        statusDiv.textContent = '자막 정보를 가져오는 중... (몇 초 걸릴 수 있습니다)';
        transcriptDiv.textContent = '';
        fetchBtn.disabled = true;

        try {
            // 1. 유튜브 웹페이지 HTML 가져오기 (프록시를 통해 CORS 우회)
            const watchUrl = `https://www.youtube.com/watch?v=${videoId}`;
            const response = await fetch(CORS_PROXY + encodeURIComponent(watchUrl));
            
            if (!response.ok) throw new Error('페이지를 불러오지 못했습니다.');
            
            const html = await response.text();

            // 2. HTML에서 ytInitialPlayerResponse JSON 추출
            // 정규식을 사용하여 자막 정보가 담긴 JSON 객체를 찾습니다.
            const match = html.match(/ytInitialPlayerResponse\s*=\s*(\{.+?\})\s*;/);
            
            if (!match || !match[1]) {
                throw new Error('페이지에서 플레이어 정보를 찾을 수 없습니다.');
            }

            // JSON 파싱
            // 주의: 유튜브 HTML에 포함된 JS 함수 등으로 인해 순수 JSON.parse가 실패할 수 있음
            const playerResponse = JSON.parse(match[1]);
            
            // 3. 자막 트랙(Caption Tracks) 추출
            const captionTracks = playerResponse?.captions?.playerCaptionsTracklistRenderer?.captionTracks;
            
            if (!captionTracks || captionTracks.length === 0) {
                throw new Error('이 영상에는 사용 가능한 자막이 없습니다.');
            }

            // 한국어 자막이 있으면 한국어, 없으면 첫 번째 자막 선택
            let track = captionTracks.find(t => t.languageCode === 'ko') || captionTracks[0];
            
            statusDiv.textContent = `자막 언어: ${track.name.simpleText} (코드: ${track.languageCode}) 다운로드 중...`;

            // 4. 자막 XML/JSON 데이터 가져오기 (fmt=json3으로 JSON 형식 요청)
            // 프록시를 통해 자막 URL 요청
            const captionUrl = track.baseUrl + "&fmt=json3";
            const captionResponse = await fetch(CORS_PROXY + encodeURIComponent(captionUrl));
            
            if (!captionResponse.ok) throw new Error('자막 데이터를 불러오지 못했습니다.');
            
            const captionData = await captionResponse.json();

            // 5. 자막 텍스트 병합
            if (captionData.events) {
                let transcriptText = captionData.events
                    .filter(event => event.segs) // 텍스트 세그먼트가 있는 이벤트만 필터링
                    .map(event => event.segs.map(seg => seg.utf8).join('')) // 세그먼트 합치기
                    .join(' ') // 모든 이벤트 합치기
                    .replace(/\n/g, ' '); // 줄바꿈 처리

                transcriptDiv.textContent = transcriptText;
                statusDiv.textContent = '✅ 자막 추출 성공!';
            } else {
                throw new Error('자막 형식을 파싱할 수 없습니다.');
            }

        } catch (error) {
            console.error(error);
            statusDiv.innerHTML = `<span class="error">오류 발생: ${error.message}</span>`;
        } finally {
            fetchBtn.disabled = false;
        }
    }
</script>

</body>
</html>
